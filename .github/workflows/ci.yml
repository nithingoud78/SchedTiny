name: CI — Build and Test

"on":
  push:
    branches:
      - main
      - dev
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build firmware for all supported boards (DISABLED)
  # Pending Milestone 4: Requires linker scripts and startup assembly.
  # ---------------------------------------------------------------------------
  firmware-build:
    name: Firmware Build (${{ matrix.board }})
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - nucleo_h743zi2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false  # Third-party is vendored, not submodules

      - name: Configure CMake
        run: |
          cmake -S firmware -B build/${{ matrix.board }} \
                -DCMAKE_TOOLCHAIN_FILE=tools/cmake/arm-none-eabi.cmake \
                -DBOARD=${{ matrix.board }} \
                -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/${{ matrix.board }} --parallel 4

      - name: Check binary size
        run: |
          arm-none-eabi-size build/${{ matrix.board }}/schedtiny.elf
          # Fail if text segment exceeds 90% of flash for the target board
          python ci/check_binary_size.py \
            --elf build/${{ matrix.board }}/schedtiny.elf \
            --board ${{ matrix.board }}

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedtiny-${{ matrix.board }}-${{ github.sha }}
          path: build/${{ matrix.board }}/schedtiny.elf
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Host-side unit tests (CMocka, no hardware required)
  # ---------------------------------------------------------------------------
  firmware-tests:
    name: Firmware Unit Tests (Host)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake gcc libcmocka-dev

      - name: Configure (host build)
        run: |
          cmake -S firmware/tests -B build/tests \
                -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build/tests --parallel 4

      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure --parallel 4

  # ---------------------------------------------------------------------------
  # Job 3: Python integration tests (DISABLED)
  # Pending Milestone 5: Requires Python analysis scripts and integration suite.
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python Integration Tests
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -r ci/requirements-ci.txt

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short
